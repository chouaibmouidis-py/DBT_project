name: dbt build & publish
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'    # Mondays — the pipeline runs while you sleep
  workflow_dispatch:        # …and a manual Run button
permissions:
  contents: write           # lets the workflow update the release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: Project_1
      - run: uv run python scripts/download_data.py
        working-directory: Project_1
      - name: Install dbt Fusion (v2)
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update --version 2.0.9
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: dbt build --profiles-dir ../ci
        working-directory: Project_1/analytics
      - name: Generate dbt docs into docs/ (served by GitHub Pages)
        run: dbt docs generate --profiles-dir ../ci --output-dir ../../docs
        working-directory: Project_1/analytics
      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "Update dbt docs [skip ci]" && git push)
      - run: |
          gh release create warehouse --notes "Warehouse — auto-built by dbt" || true
          gh release upload warehouse Project_1/data/prod.duckdb --clobber
        env:
          GH_TOKEN: ${{ github.token }}